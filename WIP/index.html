<!doctype html>
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1" />
		<title>Stardance Stats</title>
		<meta name="description" content="A better way to browse Stardance projects!" />
		<meta name="theme-color" content="#FFFFD2" />

		<meta property="og:image" content="https://stardancestats.xyz/SDS_banner_compressed.png" />
		<meta name="twitter:image" content="https://stardancestats.xyz/SDS_banner_compressed.png" />

		<meta property="og:type" content="website" />
		<meta property="og:title" content="Stardance Stats" />
		<meta property="og:description" content="A better way to browse Stardance projects!" />
		<meta property="og:image:width" content="1200" />
		<meta property="og:image:height" content="630" />
		<meta name="twitter:card" content="summary_large_image" />
		<meta name="twitter:title" content="Stardance Stats" />
		<meta name="twitter:description" content="A better way to browse Stardance projects!" />

		<link rel="icon" href="icon.png" />
		<link rel="preload" href="Exo2.woff2" as="font" type="font/woff2" crossorigin />

		<style>
			@font-face {
				font-family: 'Exo 2';
				font-style: normal;
				font-weight: 400 700;
				font-display: swap;
				src: url('Exo2.woff2') format('woff2');
			}

			* {
				margin: 0;
				padding: 0;
				box-sizing: border-box;
			}

			body {
				min-height: 100vh;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: clamp(1rem, 3vw, 2rem);
				padding: 2rem 1.25rem;
				text-align: center;
				background: #0b0920;
				color: #fff;
				font-family: 'Exo 2', system-ui, sans-serif;
				-webkit-font-smoothing: antialiased;
			}

			img {
				display: block;
				width: min(560px, 100%);
				height: auto;
			}

			h1 {
				font-size: clamp(1.75rem, 5vw, 3rem);
				font-weight: 700;
				line-height: 1.15;
			}

			.sig {
				font-size: clamp(0.875rem, 1.8vw, 1rem);
				color: #83828d;
			}
		</style>
	</head>
	<body>
		<img src="banner_trans.png" alt="Stardance Stats" width="1400" height="592" />
		<h1>I am still working on it!</h1>
		<span class="sig">~mixidmb</span>
	</body>
</html>
