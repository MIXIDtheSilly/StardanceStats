<!DOCTYPE html>
<!-- Mirrors Stardance's users/unverified_placeholder.html.erb rendered in the
     application layout: the view sets only content_for :title, so og:title
     falls back to "<title> - Stardance" and carries no handle. -->
<html lang="en">
  <head>
    <title>Verifying… - Stardance</title>
    <meta property="og:site_name" content="Stardance - Hack Club">
    <meta property="og:title" content="Verifying… - Stardance">
    <meta property="og:url" content="https://stardance.hackclub.com/users/4242/projects">
    <meta property="og:description" content="The largest STEM event of the summer: make anything you want and earn free prizes.">
  </head>
  <body class="app-layout-page">
    <div class="app-layout">
      <div class="app-layout__main">
        <section class="profile-placeholder" aria-live="polite">
          <div class="profile-placeholder__avatar-wrap">
            <img src="https://cachet.dunkirk.sh/users/U0912ABCDEF/r" alt="" class="profile-placeholder__avatar">
          </div>

          <h1 class="profile-placeholder__handle">@quiet_comet</h1>
          <p class="profile-placeholder__lede">This stardancer is still verifying their identity. Check back soon — their profile and devlogs will show up once they're done.</p>
        </section>
      </div>
    </div>
  </body>
</html>
