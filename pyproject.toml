[project]
name = "stardance-stats"
version = "0.1.0"
description = "Stats API and time-series tracker for the Stardance platform"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "motor>=3.5",
    "pymongo>=4.6",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "httpx[http2]>=0.27",
    "selectolax>=0.3.21",
    "apscheduler>=3.10",
    "python-dateutil>=2.9",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.23"]
# Needed only for socks5:// routes; http:// proxies work without it.
socks = ["httpx[socks]>=0.27"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.setuptools.packages.find]
include = ["src*"]
